<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini App Mockup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-spin" aria-hidden="true"></div>

    <div class="page-shell">
      <div class="speed-control" aria-label="Background spin controls">
        <label class="toggle-wrap" for="gifToggle">
          <span>GIF</span>
          <input id="gifToggle" type="checkbox" />
          <span class="toggle-slider"></span>
        </label>

        <label for="spinSpeed">Spin speed</label>
        <input id="spinSpeed" type="range" min="0.2" max="3" step="0.1" value="2" />
      </div>

      <div class="app-shell">
        <main class="workspace">
          <div class="center-panel">
            <h1 class="prompt-title">GenAI Diffusion Model</h1>

            <div class="prompt-box" aria-label="Prompt input">
              <input id="promptInput" type="text" class="prompt-input" placeholder="Input text here..." aria-label="Type your prompt" />
              <button id="sortButton" class="sort-button" type="button">Sort</button>
            </div>

            <div id="sortedResult" class="sorted-result" aria-live="polite"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
